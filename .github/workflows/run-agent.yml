name: Daily Tender Hunter Agent

on:
  schedule:
    - cron: '0 8 * * 1-5' # Runs automatically Monday-Friday at 8:00 AM UTC
  workflow_dispatch: # Enables manual "Run Workflow" trigger button in GitHub

jobs:
  run-sales-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Tender Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TARGET_RECIPIENT: ${{ secrets.TARGET_RECIPIENT }}
        run: python main.py
        